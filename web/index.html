<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholia on Alexa+</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a22; --line: #1f2a36; --fg: #e9eef3; --muted: #8b98a5;
    --cyan: #2fd3ff; --blue: #1a73ff; --screen: #05080c; --paper: #fffdf7; --ink: #1f1b16;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { max-width: 1180px; margin: 0 auto; padding: 20px 16px 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header b { font: 600 22px/1 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
  header span { color: var(--muted); font-size: 14px; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  @media (max-width: 920px) { main { grid-template-columns: minmax(0, 1fr); } }

  /* Device */
  .device { background: linear-gradient(#20262e, #14181d); border-radius: 28px; padding: 18px 18px 26px; box-shadow: 0 30px 60px -20px #000, inset 0 1px 0 #2c343e; }
  .screen { position: relative; aspect-ratio: 16 / 10; background: var(--screen); border-radius: 12px; overflow: hidden; }
  #card { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
  .has-card #card { opacity: 1; visibility: visible; }
  #idle { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; gap: 14px; transition: opacity .25s; }
  .has-card #idle { opacity: 0; pointer-events: none; }
  #idle h2 { margin: 0; font: 600 clamp(26px, 4.2vw, 44px)/1.1 Georgia, "Times New Roman", serif; }
  #idle p { margin: 0; color: var(--muted); font-size: clamp(14px, 1.6vw, 17px); }
  #idle h2.spoken { font-size: clamp(20px, 2.8vw, 30px); line-height: 1.3; max-width: 34ch; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: #0f151c; color: var(--fg); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip:hover { border-color: var(--cyan); }
  #caption { position: absolute; left: 0; right: 0; bottom: 6px; margin: 0 auto; width: fit-content; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: rgba(5, 8, 12, .86); color: #fff; font-size: clamp(14px, 1.7vw, 18px); line-height: 1.35; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
  #caption.on { opacity: 1; transform: none; }

  /* Alexa light bar */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: transparent; }
  [data-state="listening"] .bar { background: var(--cyan); box-shadow: 0 0 18px var(--cyan); animation: pulse 1.1s ease-in-out infinite; }
  [data-state="thinking"] .bar { background: linear-gradient(90deg, var(--blue), var(--cyan), var(--blue)); background-size: 200% 100%; animation: sweep 1s linear infinite; }
  [data-state="speaking"] .bar { background: var(--cyan); animation: pulse .6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @keyframes sweep { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none !important; } }

  /* Controls under the device */
  .controls { display: flex; align-items: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
  #mic { flex: none; width: 76px; height: 76px; border-radius: 50%; border: 0; background: radial-gradient(circle at 30% 30%, #2a3442, #121a22); box-shadow: 0 0 0 4px var(--line); color: var(--fg); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; display: grid; place-items: center; }
  #mic svg { width: 28px; height: 28px; }
  [data-state="listening"] #mic { box-shadow: 0 0 0 4px var(--cyan), 0 0 32px var(--cyan); }
  #mic:disabled { opacity: .5; cursor: wait; }
  .how { color: var(--muted); font-size: 14px; flex: 1 1 200px; }
  .how kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font: 12px ui-monospace, Menlo, monospace; color: var(--fg); }
  #type { display: flex; gap: 8px; flex: 1 1 280px; }
  #type input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: inherit; }
  #type input:focus { outline: none; border-color: var(--cyan); }
  #type button { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 0 14px; font: inherit; cursor: pointer; }

  /* Under the hood */
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; max-height: calc(100vh - 100px); display: flex; flex-direction: column; min-height: 320px; }
  aside h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pipe { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  #log { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
  .msg { padding: 8px 12px; border-radius: 12px; max-width: 92%; white-space: pre-wrap; font-size: 14px; }
  .you { align-self: flex-end; background: #233447; }
  .alexa { align-self: flex-start; background: #0f151c; border-left: 3px solid var(--cyan); }
  .tool { align-self: flex-start; color: var(--muted); font: 11px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body data-state="idle">
<header><b>Scholia</b><span>on Alexa+ · simulated Echo Show</span></header>
<main>
  <section>
    <div class="device">
      <div class="screen" id="screen">
        <div id="idle">
          <h2 id="headline">Remembers what you forget.</h2>
          <p id="sub">Hold the mic or Space and talk, or tap a phrase.</p>
          <div class="chips">
            <button class="chip">Review with Scholia</button>
            <button class="chip">What does aliasing mean?</button>
            <button class="chip">How am I doing?</button>
            <button class="chip">Let's stop here</button>
          </div>
        </div>
        <iframe id="card" sandbox="allow-scripts" title="MCP App card"></iframe>
        <div id="caption" aria-live="polite"></div>
        <div class="bar"></div>
      </div>
    </div>
    <div class="controls">
      <button id="mic" aria-label="Hold to talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <div class="how" id="how">Hold to talk, or hold <kbd>Space</kbd>.</div>
      <form id="type"><input id="text" placeholder="Or type what you'd say" autocomplete="off"><button>Send</button></form>
    </div>
  </section>
  <aside>
    <h3>Under the hood</h3>
    <p class="pipe">Transcribe → Nova (tool use) → Scholia MCP → Polly</p>
    <div id="log"><p class="empty">Turns and MCP tool calls appear here.</p></div>
  </aside>
</main>
<script>
// randomUUID needs a secure context; opening the page from a LAN address is not one.
const conversation = crypto.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now().toString(36);
const mic = document.getElementById("mic");
const how = document.getElementById("how");
const log = document.getElementById("log");
const card = document.getElementById("card");
const screen = document.getElementById("screen");
const caption = document.getElementById("caption");
const textInput = document.getElementById("text");
const headline = document.getElementById("headline");
const sub = document.getElementById("sub");
let pendingCard = null;
let busy = false;

function setState(s) { document.body.dataset.state = s; how.textContent = { listening: "Listening…", thinking: "Thinking…", speaking: "Speaking…" }[s] || ""; if (s === "idle") how.innerHTML = 'Hold to talk, or hold <kbd>Space</kbd>.'; }
function add(cls, text) {
  log.querySelector(".empty")?.remove();
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.appendChild(d);
  log.scrollTop = log.scrollHeight; return d;
}
let captionTimer;
function say(text) { clearTimeout(captionTimer); caption.textContent = text; caption.classList.add("on"); }
/* Like the device: captions fade a few seconds after Alexa stops talking, so the card is readable. */
function fadeCaption() { clearTimeout(captionTimer); captionTimer = setTimeout(() => caption.classList.remove("on"), 4000); }

/* --- MCP Apps host side: answer ui/initialize, push tool-result after initialized --- */
window.addEventListener("message", (e) => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0" || e.source !== card.contentWindow) return;
  if (m.method === "ui/initialize") {
    e.source.postMessage({ jsonrpc: "2.0", id: m.id, result: { protocolVersion: "2025-06-18", hostCapabilities: {}, hostInfo: { name: "scholia-sim-alexa", version: "0.1.0" }, hostContext: { theme: "light", displayMode: "fullscreen" } } }, "*");
  } else if (m.method === "ui/notifications/initialized" && pendingCard) {
    e.source.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: { content: [], structuredContent: pendingCard.structuredContent } }, "*");
  } else if (m.id !== undefined && m.method) {
    e.source.postMessage({ jsonrpc: "2.0", id: m.id, result: {} }, "*");
  }
});
function showCard(c) { pendingCard = c; card.srcdoc = c.html; screen.classList.add("has-card"); }
/* No card this turn: like the device, put what Alexa said on screen in large type. */
function showSpeech(text) {
  screen.classList.remove("has-card");
  headline.textContent = text; headline.classList.add("spoken"); sub.hidden = true;
}

/* --- Speech out --- */
function play(b64) { return new Promise((r) => { const a = new Audio("data:audio/mpeg;base64," + b64); a.onended = r; a.onerror = r; a.play().catch(r); }); }

/* --- One turn: text -> /chat -> card, caption, audio --- */
async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; mic.disabled = true;
  add("you", text); caption.classList.remove("on"); setState("thinking");
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ conversation, text }) });
    const turn = await res.json();
    if (turn.error) { add("alexa", "Error: " + turn.error); return; }
    for (const t of turn.toolCalls) add("tool", "→ " + t.name + " " + JSON.stringify(t.args));
    add("alexa", turn.speech);
    if (turn.card) { showCard(turn.card); say(turn.speech); } else showSpeech(turn.speech);
    setState("speaking");
    await play(turn.audio);
  } finally { busy = false; mic.disabled = false; setState("idle"); fadeCaption(); }
}
document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => send(b.textContent)));
document.getElementById("type").addEventListener("submit", (e) => { e.preventDefault(); const t = textInput.value; textInput.value = ""; send(t); });

/* --- Speech in: push-to-talk over WebSocket, PCM 16 kHz mono --- */
let rec = null;
async function start() {
  if (busy || rec) return;
  const r = (rec = { released: false });
  setState("listening");
  r.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  if (r.released) return release(r);
  r.ctx = new AudioContext({ sampleRate: 16000 });
  const src = r.ctx.createMediaStreamSource(r.stream);
  const proc = r.ctx.createScriptProcessor(4096, 1, 1);
  const ws = (r.ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/stt"));
  ws.binaryType = "arraybuffer";
  const partial = add("you", "…");
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.partial) partial.textContent = m.partial;
    if (m.error) partial.textContent = "STT error: " + m.error;
    if (m.final !== undefined) {
      partial.remove();
      if (m.final) send(m.final);
      else { add("alexa", "I didn't catch that."); say("I didn't catch that."); fadeCaption(); }
    }
  };
  await new Promise((ok) => (ws.onopen = ok));
  proc.onaudioprocess = (e) => {
    if (ws.readyState !== 1 || r.released) return;
    const f = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) i16[i] = Math.max(-32768, Math.min(32767, Math.round(f[i] * 32767)));
    ws.send(i16.buffer);
  };
  src.connect(proc); proc.connect(r.ctx.destination);
  if (r.released) release(r);
}
function release(r) {
  if (r.ws && r.ws.readyState === 1) r.ws.send("end");
  r.stream?.getTracks().forEach((t) => t.stop());
  r.ctx?.close();
}
function stop() {
  const r = rec; if (!r) return;
  rec = null; r.released = true;
  if (document.body.dataset.state === "listening") setState("idle");
  // Still opening the mic or the socket: start() sees released and cleans up once it gets there.
  if (r.ws && r.ws.readyState === 1) release(r);
}
function begin() { start().catch((err) => { rec = null; setState("idle"); add("alexa", "Mic error: " + err.message); }); }
mic.addEventListener("pointerdown", (e) => { e.preventDefault(); begin(); });
mic.addEventListener("pointerup", stop);
mic.addEventListener("pointerleave", stop);
document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && document.activeElement !== textInput) { e.preventDefault(); begin(); } });
document.addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement !== textInput) { e.preventDefault(); stop(); } });
</script>
</body>
</html>
